# Snippetfy v2 — stack nova (isolada do legacy-app/)
# Uso: docker compose up --build
# Web: http://localhost:5173  |  API: http://localhost:4000  |  Postgres: localhost:5433

name: snippetfy-v2

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snippetfy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snippetfy}
      POSTGRES_DB: ${POSTGRES_DB:-snippetfy}
    ports:
      - "5433:5432"
    volumes:
      - snippetfy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-snippetfy} -d ${POSTGRES_DB:-snippetfy}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-snippetfy}:${POSTGRES_PASSWORD:-snippetfy}@db:5432/${POSTGRES_DB:-snippetfy}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./packages/shared/src:/app/packages/shared/src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/shared/src:/app/packages/shared/src

volumes:
  snippetfy_pg_data:
